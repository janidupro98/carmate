<title>VehicleMate AI</title>

<style>
/* Layout: one phone-width column on a soft grey ground. White rounded cards, black arrow buttons, a single blue accent, lime kept for emphasis and "best" marks. */
:root{
  --bg:#e8eaee; --surface:#ffffff; --surface2:#f1f3f6; --ink:#0c0e12; --muted:#5b6370; --line:#dcdfe5;
  --accent:#2557f6; --accent-ink:#ffffff; --accent-soft:#dfe7ff;
  --lime:#c9f03a; --lime-ink:#1d2606;
  --btn:#0c0e12; --btn-ink:#ffffff;
  --good:#16854a; --warn:#b06e00; --bad:#cf2f2b;
  --car:#14171c; --glass:#8b97a9; --rim:#c4cad4;
  --c1:#2557f6; --c2:#c9f03a; --c3:#0c0e12; --c4:#8fa8ff; --c5:#b9bfca;
  --shadow:0 8px 30px rgba(12,14,18,.12);
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f13; --surface:#171a20; --surface2:#20242c; --ink:#f1f3f6; --muted:#9aa3b1; --line:#2b303a;
  --accent:#4f7dff; --accent-ink:#ffffff; --accent-soft:#1c2a52;
  --btn:#f1f3f6; --btn-ink:#0c0e12;
  --good:#3fcf7f; --warn:#f0b23a; --bad:#ff6b66;
  --car:#d3d9e2; --glass:#3b4454; --rim:#5a6475;
  --c1:#4f7dff; --c3:#f1f3f6; --c4:#2f3f78; --c5:#4a5262;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d0f13; --surface:#171a20; --surface2:#20242c; --ink:#f1f3f6; --muted:#9aa3b1; --line:#2b303a;
  --accent:#4f7dff; --accent-ink:#ffffff; --accent-soft:#1c2a52;
  --btn:#f1f3f6; --btn-ink:#0c0e12;
  --good:#3fcf7f; --warn:#f0b23a; --bad:#ff6b66;
  --car:#d3d9e2; --glass:#3b4454; --rim:#5a6475;
  --c1:#4f7dff; --c3:#f1f3f6; --c4:#2f3f78; --c5:#4a5262;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark;}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px;zoom:var(--ts,1)}
.screen{display:flex;flex-direction:column;gap:16px;min-width:0}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.title{font-family:var(--display);font-weight:800;font-size:31px;line-height:1.04;letter-spacing:-.025em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.015em}
.sub{color:var(--muted);margin-top:6px}
.small{font-size:13px;color:var(--muted)}
.i{flex:none;display:block}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.circle{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-decoration:none;border:0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;letter-spacing:.06em;font-size:13px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center}
.org{background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:700;font-size:12px;letter-spacing:.06em}

/* cards */
.card{background:var(--surface);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.go{width:44px;height:44px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;border:0;flex:none;text-decoration:none;cursor:pointer}
.ib{width:42px;height:42px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}

/* home tiles */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:26px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:158px;text-decoration:none;min-width:0}
.tile .tt{display:flex;justify-content:space-between;align-items:flex-start}
.tile .tx{display:flex;flex-direction:column;gap:3px}
.tile b{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.tile small{font-size:13px;color:var(--muted)}
.tile.hero{background:var(--accent);color:var(--accent-ink);grid-column:1/-1;min-height:178px}
.tile.hero small{color:rgba(255,255,255,.85)}
.tile.hero .ib{background:rgba(255,255,255,.2);color:#fff}
.tile.dark{background:var(--btn);color:var(--btn-ink);grid-column:1/-1;min-height:0;gap:18px}
.tile.dark small{color:inherit;opacity:.72}
.tile.dark .ib{background:rgba(127,127,127,.25)}
.tile.dark .go{background:var(--lime);color:var(--lime-ink)}
.linkrow{display:flex;gap:10px;flex-wrap:wrap}
.pillink{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:11px 16px;font-weight:700;text-decoration:none}

/* chips and fields */
.q{display:flex;flex-direction:column;gap:10px}
.q>b{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;background:var(--surface2);border:0;font-weight:600;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:5px;border-radius:999px}
.seg2 button{border:0;background:none;padding:13px 10px;border-radius:999px;font-weight:700;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span:first-child{font-size:13px;font-weight:600;color:var(--muted)}
.inp{position:relative;display:block}
.inp input,.field select,.field textarea{width:100%;min-width:0;background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600}
.inp input{padding-right:64px}
.inp em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--muted);font-weight:600;pointer-events:none}
.field textarea{resize:vertical;min-height:84px;font-weight:500}
.inp input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:13px;color:var(--muted)}
.hint b{color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;cursor:pointer;text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 20px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--btn);color:var(--btn-ink)}
.btn.blue{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}

/* summary */
.sum{background:var(--accent);color:var(--accent-ink);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sumrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sum small{display:block;font-size:13px;opacity:.85;font-weight:600}
.sum strong{display:block;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sum p{font-size:13px;opacity:.92}
.warnbox{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;font-size:13px}

/* cost overview */
.bar{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface2)}
.bar span{display:block;min-width:3px}
.rows{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:14px 1fr auto 44px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.crow:first-child{border-top:0}
.sw{width:12px;height:12px;border-radius:50%}
.crow .pc{color:var(--muted);text-align:right;font-size:13px}
.tot{display:flex;justify-content:space-between;gap:12px;padding-top:12px;border-top:2px solid var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--muted)}

/* vehicle cards */
.stage{background:var(--surface2);border-radius:20px;padding:14px 12px 6px}
.stage svg{width:100%;height:auto;display:block;max-height:120px}
.vhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.vname{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.vname small{font-family:var(--body);font-weight:600;font-size:14px;color:var(--muted);letter-spacing:0}
.tag{display:inline-block;background:var(--lime);color:var(--lime-ink);font-weight:700;font-size:12px;border-radius:999px;padding:5px 10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:13px}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.why li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:9px}
.empty{background:var(--surface);border-radius:26px;padding:22px;text-align:center;color:var(--muted)}

/* compare */
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cell{padding:10px 6px;background:var(--surface2);border-radius:12px;font-weight:700;text-align:center;font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cell.best{background:var(--lime);color:var(--lime-ink)}
.crow2{display:flex;flex-direction:column;gap:6px}
.crow2>span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cv{display:flex;flex-direction:column;gap:6px;min-width:0;text-align:center}
.cv .stage{padding:8px 4px 2px;border-radius:14px}
.cv .nm{font-weight:700;font-size:13px;line-height:1.2;min-height:32px}
.cv select{width:100%;min-width:0;background:var(--surface2);border:0;border-radius:10px;padding:8px 6px;font-size:12px;font-weight:600}

/* checklist */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:20px;padding:14px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.verdict{font-size:14px}
.grp h3{font-family:var(--display);font-size:17px;font-weight:700;margin-bottom:2px}
.it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;cursor:pointer}
.it .st{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px dashed var(--line);color:#fff}
.it[data-s="ok"] .st{background:var(--good);border:0}
.it[data-s="bad"] .st{background:var(--bad);border:0}
.it .lb{flex:1;min-width:0;font-size:14px}
.it .sl{font-size:12px;font-weight:700;color:var(--muted);flex:none}
.it[data-s="ok"] .sl{color:var(--good)}
.it[data-s="bad"] .sl{color:var(--bad)}

/* tab bar */
.tabs{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:999px;text-decoration:none;font-size:11px;font-weight:700;color:var(--muted)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
textarea.out{min-height:150px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:4px 8px 0}
.rt{display:flex;align-items:center;gap:8px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface2);padding:5px;border-radius:999px}
.seg3 button{border:0;background:none;padding:12px 8px;border-radius:999px;font-weight:700;cursor:pointer}
.seg3 button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.swb{width:46px;height:46px;border-radius:50%;border:3px solid var(--surface);outline:2px solid transparent;display:grid;place-items:center;color:#fff;cursor:pointer;padding:0}
.swb[aria-pressed="true"]{outline-color:var(--ink)}
@media (hover:hover){.tile,.pillink,.btn,.chip{transition:transform .15s ease,filter .15s ease}.tile:hover{transform:translateY(-2px)}.btn:hover,.pillink:hover{filter:brightness(1.06)}.chip:hover{filter:brightness(.97)}}
/* small phones */
@media (max-width:360px){.row2{grid-template-columns:1fr}.title{font-size:26px}.cells{gap:6px}.cell{font-size:13px;padding:10px 4px}.tabs a{font-size:10px}}
/* tablets: wider column, three-up home tiles, two-up results */
@media (min-width:700px){
 .shell{max-width:720px}
 .tabs{max-width:520px;width:100%;margin-inline:auto}
 .title{font-size:36px}
 .grid2{grid-template-columns:repeat(3,minmax(0,1fr))}
 .grid2 .tile.hero{grid-column:span 2}
 .grid2 .tile.dark{grid-column:1/-1}
 #matches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
/* laptops and desktops: side navigation, wider content, two-column forms */
@media (min-width:1000px){
 .shell{max-width:1140px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
 .screen{grid-column:2;grid-row:1}
 .tabs{grid-column:1;grid-row:1;position:sticky;top:max(16px,env(safe-area-inset-top,0px));bottom:auto;max-width:none;width:auto;margin:0;grid-template-columns:1fr;border-radius:26px;padding:10px;gap:4px}
 .tabs a{flex-direction:row;justify-content:flex-start;gap:12px;padding:13px 16px;font-size:14px}
 #matches{grid-template-columns:repeat(3,minmax(0,1fr))}
 #screen[data-r="finance"],#screen[data-r="exchange"],#screen[data-r="check"]{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
 #screen[data-r="finance"]>:nth-child(-n+4),#screen[data-r="exchange"]>:nth-child(-n+4){grid-column:1/-1}
 #screen[data-r="check"]>:nth-child(-n+5),#screen[data-r="check"]>:last-child{grid-column:1/-1}
 #screen[data-r="compare"],#screen[data-r="sell"],#screen[data-r="help"],#screen[data-r="preferences"],#screen[data-r="summary"]{max-width:760px}
}
@media (min-width:600px){body{padding-block:32px}}
@media (prefers-reduced-motion:no-preference){.screen>*{animation:rise .35s ease both}@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

  <nav class="tabs" id="tabs" aria-label="Main"></nav>
</div>

var BUD=[{lo:0,hi:50},{lo:50,hi:80},{lo:80,hi:120},{lo:120,hi:1e9}];
var UP=[10,17.5,30,50];
var Q=[
 {k:'budget',t:'What is your total budget?',o:[['0','Below Rs. 50 lakhs'],['1','Rs. 50 to 80 lakhs'],['2','Rs. 80 to 120 lakhs'],['3','Above Rs. 120 lakhs']]},
 {k:'up',t:'How much can you pay upfront?',o:[['0','Below Rs. 15 lakhs'],['1','Rs. 15 to 20 lakhs'],['2','Rs. 20 to 40 lakhs'],['3','Above Rs. 40 lakhs']]},
 {k:'use',t:'What will you mainly use it for?',o:[['family','Family and everyday use'],['business','Business or tourism'],['commute','Daily commuting'],['luxury','Luxury and performance']]},
 {k:'prio',t:'What matters most?',o:[['cost','Low fuel and maintenance costs'],['safety','Safety and reliability'],['comfort','Comfort and features'],['resale','Resale value']]},
 {k:'cond',t:'Which condition do you prefer?',o:[['new','Brand new'],['used','Used'],['either','Either']]}
];
function matches(){
 var a=S.find,b=BUD[+a.budget],up=UP[+a.up],out=[];
 V.forEach(function(v){
  if(!(v.max>=b.lo*0.6&&v.min<=b.hi))return;
  if(a.cond==='new'&&v.cond==='used')return;
  if(a.cond==='used'&&v.cond==='new')return;
  var s=0,why=[];
  if(v.uses.indexOf(a.use)>-1){s+=3;
   why.push(a.use==='family'?'Seats '+v.seats+' for family use':a.use==='business'?'Suits business and tourism work':a.use==='commute'?'Good for daily commuting':'Matches a luxury or performance brief')}
  var pv=a.prio==='cost'?(v.fs+v.ms)/2:a.prio==='safety'?v.safety:a.prio==='comfort'?v.comfort:v.resale;
  s+=pv*1.2;
  why.push(a.prio==='cost'?v.eff+' with '+v.maint.toLowerCase()+' servicing cost':a.prio==='safety'?'Safety rating '+v.safety+' of 5':a.prio==='comfort'?'Comfort rating '+v.comfort+' of 5':'Resale rating '+v.resale+' of 5');
  var bal=Math.max(0,v.mid-up);
  out.push({v:v,score:s,why:why,bal:bal,monthly:bal>0?pmt(bal*1e5,12,60):0,up:up});
 });
 out.sort(function(x,y){return y.score-x.score});
 return out.slice(0,5);
}

var TRADE={excellent:[4,8],good:[8,13],fair:[13,20],poor:[20,30]};
var KMADJ={low:-2,avg:0,high:4};
function tradeRange(){var f=S.fin,d=TRADE[f.cond],adj=KMADJ[f.km];
 var d0=Math.max(0,d[0]+adj),d1=Math.max(d0,d[1]+adj);
 return {lo:f.mkt*(1-d1/100),hi:f.mkt*(1-d0/100)}}
function num(id,label,unit,val,step){return '<label class="field"><span>'+label+'</span><span class="inp"><input id="'+id+'" data-f="'+id+'" type="number" inputmode="decimal" min="0" step="'+(step||'any')+'" value="'+val+'"><em>'+unit+'</em></span></label>'}
function sel(id,label,opts,val,attr){return '<label class="field"><span>'+label+'</span><select id="'+id+'" '+attr+'="'+id+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(String(o[0])===String(val)?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label>'}
function autofill(){var f=S.fin,r=tradeRange();
 if(!f.touched.value){f.value=Math.round((r.lo+r.hi)/2*100)/100;setVal('value',f.value)}
 var p=f.price*1e5;
 if(!f.touched.ins){f.ins=Math.round(p*0.02/1000)*1000;setVal('ins',f.ins)}
 if(!f.touched.svc){f.svc=Math.round(p*0.012/1000)*1000;setVal('svc',f.svc)}
 if(!f.touched.tyre){f.tyre=Math.round(p*0.004/1000)*1000;setVal('tyre',f.tyre)}
 var el=$('#trade');if(el)el.innerHTML='Typical trade-in offers for this condition and mileage: <b>'+lk(r.lo)+' to '+lk(r.hi)+'</b>. <button class="linkbtn" data-act="use">Use the middle</button>'}
function calcFin(){var f=S.fin;
 var equity=f.exchange?f.value-f.out:0;
 var bal=f.price-equity-f.cash;
 var loan=Math.max(0,bal);
 var inst=loan>0?pmt(loan*1e5,f.rate,f.term):0;
 var fuelM=f.kmpl>0?f.kmMonth/f.kmpl*f.fuel:0;
 var items=[['Loan installment',inst,'var(--c1)'],['Fuel or charging',fuelM,'var(--c2)'],['Insurance',f.ins/12,'var(--c3)'],['Servicing and repairs',f.svc/12,'var(--c4)'],['Tyres and other',f.tyre/12,'var(--c5)']];
 var total=items.reduce(function(a,i){return a+i[1]},0);
 var notes=[];
 if(f.exchange&&equity<0)notes.push('You owe '+lk(-equity)+' more than your vehicle is worth. That amount has to be paid before anything goes toward the next vehicle.');
 if(bal<0)notes.push('Your vehicle and cash cover the price with about '+lk(-bal)+' left over.');
 else if(bal===0)notes.push('No finance is needed.');
 var top=$('#fin-top');
 if(top)top.innerHTML='<div class="sumrow"><div><small>'+(bal<0?'Left over':'Balance to fund')+'</small><strong>'+lk(Math.abs(bal))+'</strong></div><div><small>Estimated monthly total</small><strong>'+rs(total)+'</strong></div></div>'+
  '<p>'+(loan>0?'Installment about '+rs(inst)+' a month over '+f.term+' months at '+fmt(f.rate,1)+'% a year.':'No loan installment in this plan.')+'</p>'+notes.map(function(n){return '<div class="warnbox">'+n+'</div>'}).join('');
 var det=$('#fin-detail');
 if(det)det.innerHTML='<div class="vhead"><div><h2>Cost overview</h2><p class="small">Clear view of monthly costs</p></div></div>'+
  '<div class="bar" role="img" aria-label="Monthly cost split">'+items.filter(function(i){return i[1]>0}).map(function(i){return '<span style="flex:'+i[1]+' 1 0;background:'+i[2]+'"></span>'}).join('')+'</div>'+
  '<div class="rows">'+items.map(function(i){return '<div class="crow"><span class="sw" style="background:'+i[2]+'"></span><span>'+i[0]+'</span><b>'+rs(i[1])+'</b><span class="pc">'+(total>0?Math.round(i[1]/total*100):0)+'%</span></div>'}).join('')+'</div>'+
  '<div class="tot"><span>Total per month</span><span>'+rs(total)+'</span></div>'+
  '<div class="kv"><span>Total per year</span><span>'+rs(total*12)+'</span></div>'+
  '<div class="kv"><span>Paid from your side now</span><span>'+lk(Math.max(0,equity)+f.cash)+'</span></div>'+
  (loan>0?'<div class="kv"><span>Interest over the loan term</span><span>'+rs(inst*f.term-loan*1e5)+'</span></div>':'')+
  '<p class="hint">Balance = replacement price − (current value − amount still owed) − extra cash. Fees, duties and taxes are not included. Trade-in value, settlement amount and loan approval must be confirmed with the dealer and lender.</p>'
}

  num('mkt','Market value for similar vehicles','lakhs',f.mkt,'0.5')+
  '<div class="row2">'+sel('cond','Condition',[['excellent','Excellent'],['good','Good'],['fair','Fair'],['poor','Needs work']],f.cond,'data-f')+sel('km','Mileage',[['low','Low for its age'],['avg','Average'],['high','High for its age']],f.km,'data-f')+'</div>'+
  '<p class="hint" id="trade"></p>'+
  '<div class="row2">'+num('value','Value used here','lakhs',f.value,'0.5')+num('out','Still owed on lease or loan','lakhs',f.out,'0.5')+'</div></div>':'')+
 '<div class="card"><h2>The vehicle you want</h2><div class="row2">'+num('price','Price','lakhs',f.price,'0.5')+num('cash','Extra cash you can pay','lakhs',f.cash,'0.5')+'</div></div>'+
 '<div class="card"><h2>Loan assumptions</h2><div class="row2">'+sel('term','Term',[[36,'36 months'],[48,'48 months'],[60,'60 months'],[72,'72 months'],[84,'84 months']],f.term,'data-f')+num('rate','Interest rate','% a year',f.rate,'0.1')+'</div><p class="hint">The rate is a placeholder. Use the rate in your lender\'s written quotation.</p></div>'+
 '<div class="card"><h2>Running costs</h2><div class="row2">'+num('kmMonth','Distance per month','km',f.kmMonth,'50')+num('kmpl','Fuel economy','km per litre',f.kmpl,'0.5')+'</div><div class="row2">'+num('fuel','Fuel price','Rs per litre',f.fuel,'1')+num('ins','Insurance per year','Rs',f.ins,'1000')+'</div><div class="row2">'+num('svc','Servicing and repairs per year','Rs',f.svc,'1000')+num('tyre','Tyres and other per year','Rs',f.tyre,'1000')+'</div><p class="hint">Insurance and servicing start from typical shares of the vehicle price. Change them to match your quotes. For an electric vehicle, enter a petrol-equivalent economy.</p></div>'+
 '<div class="card" id="fin-detail"></div>'
}

/* ---------- Check ---------- */
var CHK=[
 {g:'Documents',items:[['cr','Original registration certificate seen and the seller\'s name matches it'],['vin','Chassis and engine numbers match the certificate'],['own','Number of previous owners matches the advertisement'],['lic','Revenue licence and insurance are valid'],['emi','Emission test certificate is valid'],['nof','Written confirmation that no lease or loan is outstanding','buy']]},
 {g:'If the vehicle is on lease',lease:true,items:[['set','Settlement letter from the lender with the exact payoff amount'],['con','Lender consent for the ownership transfer'],['ear','Early settlement fee and remaining term understood']]},
 {g:'Mileage and service',items:[['svc','Service records from the authorised centre or a named garage'],['odo','Odometer fits the service dates and the wear on pedals, seat and steering wheel'],['auc','If imported, the auction sheet grade and mileage match what the seller says']]},
 {g:'Body and accident signs',items:[['gap','Panel gaps are even, with no paint mismatch or overspray'],['rus','Underbody, chassis and door sills show no rust or weld repairs'],['lam','No warning lamps after starting, and the airbag light goes out'],['wet','No damp smell, mud or water lines under carpets and seats']]},
 {g:'Mechanical and test drive',items:[['cold','Started from cold with no smoke or rough idle'],['drv','Drove 20 minutes or more: straight steering, firm brakes, smooth gearbox'],['ac','Air conditioning cools quickly'],['bat','Hybrid or EV battery health checked by a specialist, if applicable'],['ins','Independent inspection booked and its report read']]},
 {g:'Seller and payment',items:[['sel','Met the seller at a registered address or showroom'],['dep','No deposit paid before seeing the vehicle and the original certificate'],['pay','Payment by traceable bank transfer with a signed receipt'],['tra','Transfer forms signed together and filed with the Department of Motor Traffic']]}
];
function chkItems(){var out=[];CHK.forEach(function(g){if(g.lease&&S.mode!=='lease')return;g.items.forEach(function(i){if(i[2]==='buy'&&S.mode==='lease')return;out.push(i[0])})});return out}
function cstate(id){return (S.chk[S.chkV]||{})[id]||'open'}
function stIcon(s){return s==='ok'?ico('check',16):s==='bad'?ico('alert',16):''}
function stLabel(s){return s==='ok'?'Checked':s==='bad'?'Concern':'Open'}
function renderCheckSummary(){var ids=chkItems(),ok=0,bad=0;ids.forEach(function(i){var s=cstate(i);if(s==='ok')ok++;if(s==='bad')bad++});
 var open=ids.length-ok-bad,el=$('#chk-sum');if(!el)return;
 var msg=bad>=3?'Several concerns. Do not pay anything yet. Get the answers in writing or walk away.':
  bad>=1?'Resolve each concern with proof, or negotiate the price, before you pay.':
  open>0?open+' items still to check. Finish them before you pay a deposit.':
  'No concerns recorded. A paid independent inspection is still the safest last step.';
 el.innerHTML='<div class="stats"><div class="stat"><b style="color:var(--good)">'+ok+'</b><span>Checked</span></div><div class="stat"><b style="color:var(--bad)">'+bad+'</b><span>Concerns</span></div><div class="stat"><b>'+open+'</b><span>Still open</span></div></div>'+
  '<div class="card"><div class="bar" role="img" aria-label="Checklist progress"><span style="flex:'+ok+' 1 0;background:var(--good)"></span><span style="flex:'+bad+' 1 0;background:var(--bad)"></span><span style="flex:'+open+' 1 0;background:var(--c5)"></span></div><p class="verdict">'+msg+'</p><p class="hint">This list records what you saw. It cannot verify records the app has no access to.</p></div>'}
function checkScreen(){var v=byId(S.chkV);
 return topbar(true)+
 '<div><h1 class="title">Check before you buy</h1><p class="sub">Record what you see before you pay a deposit.</p></div>'+
 '<div class="card"><label class="field"><span>Vehicle you are looking at</span><select id="ckv" data-ck="1">'+V.map(function(x){return '<option value="'+x.id+'"'+(x.id===S.chkV?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select></label>'+
 '<div class="vhead"><div class="vname">'+esc(v.name)+'<br><small>'+esc(v.trim)+'</small></div></div><div class="stage">'+car(v.type)+'</div>'+
 '<div class="pills"><span class="pill">'+v.min+' to '+v.max+' lakhs</span><span class="pill">'+v.seats+' seats</span><span class="pill">'+esc(v.eff)+'</span><span class="pill">Safety '+v.safety+'/5</span><span class="pill">Servicing '+v.maint.toLowerCase()+'</span></div></div>'+
 '<div class="seg2" role="group" aria-label="How you are paying"><button data-act="mode" data-v="lease" aria-pressed="'+(S.mode==='lease')+'">Leasing</button><button data-act="mode" data-v="buy" aria-pressed="'+(S.mode==='buy')+'">Buy</button></div>'+
 '<div class="screen" id="chk-sum" style="gap:12px"></div>'+
 CHK.filter(function(g){return !g.lease||S.mode==='lease'}).map(function(g){return '<div class="card grp"><h3>'+g.g+'</h3><div>'+g.items.filter(function(i){return !(i[2]==='buy'&&S.mode==='lease')}).map(function(i){var s=cstate(i[0]);return '<button class="it" data-act="item" data-i="'+i[0]+'" data-s="'+s+'"><span class="st">'+stIcon(s)+'</span><span class="lb">'+i[1]+'</span><span class="sl">'+stLabel(s)+'</span></button>'}).join('')+'</div></div>'}).join('')+
 '<p class="foot">Tap an item to cycle Open, Checked and Concern. Transfers are filed through the <a href="https://www.dmt.gov.lk" target="_blank" rel="noopener">Department of Motor Traffic</a>.</p>'
}

/* ---------- Compare ---------- */
var CROWS=[
 ['Price in lakhs',function(v){return v.min+' to '+v.max},function(v){return -v.mid}],
 ['Fuel use',function(v){return v.ev?'EV':v.kmpl+' km/l'},function(v){return -v.rsKm}],
 ['Fuel for 1,200 km',function(v){return rs(v.rsKm*1200)},function(v){return -v.rsKm}],
 ['Seats',function(v){return v.seats},function(v){return v.seats}],
 ['Safety out of 5',function(v){return v.safety},function(v){return v.safety}],
 ['Comfort out of 5',function(v){return v.comfort},function(v){return v.comfort}],
 ['Servicing cost',function(v){return v.maint},function(v){return v.ms}],
 ['Resale out of 5',function(v){return v.resale},function(v){return v.resale}]
];
function renderCompare(){var el=$('#cmp');if(!el)return;var vs=S.cmp.map(byId);
 var head='<div class="cells">'+vs.map(function(v,i){return '<div class="cv"><div class="stage">'+car(v.type)+'</div><div class="nm">'+esc(v.name)+'</div><select data-c="'+i+'" aria-label="Swap vehicle '+(i+1)+'"><option value="">Swap vehicle</option>'+V.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+'</option>'}).join('')+'</select></div>'}).join('')+'</div>';
 var rows=CROWS.map(function(r){var sc=vs.map(r[2]),mx=Math.max.apply(null,sc),all=sc.every(function(x){return x===sc[0]});
  return '<div class="crow2"><span>'+r[0]+'</span><div class="cells">'+vs.map(function(v,i){return '<div class="cell'+(!all&&sc[i]===mx?' best':'')+'">'+r[1](v)+'</div>'}).join('')+'</div></div>'}).join('');
 el.innerHTML=head+rows+'<p class="hint">Highlighted cells are the strongest in that row. Ratings and prices are illustrative.</p>'}
function compareScreen(){
 return topbar(true)+'<div><h1 class="title">Compare vehicles</h1><p class="sub">Understand the differences before you decide.</p></div><div class="card" id="cmp"></div>'+
 '<div class="btns"><a class="btn blue" href="#find">Back to matches</a><a class="btn ghost" href="#help">Ask an expert</a></div>'
}

/* ---------- Sell ---------- */
var PHOTOS=['Front three-quarter view','Rear three-quarter view','Both sides, full length','Dashboard with the odometer reading','Front and rear seats','Boot and spare wheel','Engine bay','Tyre tread and any damage up close'];
function sellText(){var s=S.sell;
 return s.year+' '+s.title+'\nAsking price: '+lk(s.price)+'\nMileage: '+fmt(s.km)+' km\nCondition: '+s.cond+'\n\n'+s.notes+'\n\nViewing by appointment. The original registration certificate is available to inspect at the viewing.'}
function sellScreen(){var s=S.sell;
 return topbar(true)+'<div><h1 class="title">Sell my vehicle</h1><p class="sub">Prepare a clear listing and take safer viewings.</p></div>'+
 '<div class="card"><h2>Vehicle details</h2>'+
 '<label class="field"><span>Make and model</span><span class="inp"><input id="s-title" data-s="title" type="text" value="'+esc(s.title)+'" style="padding-right:14px"></span></label>'+
 '<div class="row2">'+num2('s-year','Year','year',s.year)+num2('s-km','Mileage','km',s.km)+'</div>'+
 '<div class="row2">'+num2('s-price','Asking price','lakhs',s.price)+
 '<label class="field"><span>Condition</span><select id="s-cond" data-s="cond">'+['Excellent','Good','Fair','Needs work'].map(function(c){return '<option'+(c===s.cond?' selected':'')+'>'+c+'</option>'}).join('')+'</select></label></div>'+
 '<label class="field"><span>Notes for buyers</span><textarea id="s-notes" data-s="notes">'+esc(s.notes)+'</textarea></label></div>'+
 '<div class="card"><h2>Your listing</h2><textarea class="out" id="out-sell" readonly aria-label="Generated listing">'+esc(sellText())+'</textarea><button class="btn blue" data-act="copy" data-t="out-sell" data-label="Copy listing">Copy listing</button></div>'+
 '<div class="card"><h2>Photos buyers expect</h2><div>'+PHOTOS.map(function(p,i){return '<label class="it" style="cursor:pointer"><input type="checkbox" id="ph'+i+'" style="width:20px;height:20px;accent-color:var(--accent);flex:none"><span class="lb">'+p+'</span></label>'}).join('')+'</div></div>'+
 '<div class="card"><h2>Safer viewings</h2><ul class="why"><li>Meet at your home or a showroom, in daytime.</li><li>Show a copy of the certificate and keep the original with you.</li><li>Hand over the vehicle only after the money has cleared in your account.</li><li>Sign the transfer forms together and keep your copies.</li></ul></div>'
}
function num2(id,label,unit,val){return '<label class="field"><span>'+label+'</span><span class="inp"><input id="'+id+'" data-s="'+id.slice(2)+'" type="number" inputmode="decimal" min="0" step="any" value="'+val+'"><em>'+unit+'</em></span></label>'}

/* ---------- Help ---------- */
function helpText(){var h=S.help;
 return 'Hello JANIDU HOLDINGS, my name is '+(h.name.trim()||'(name)')+'. I need: '+h.need+'. My budget is '+h.budget+'.'+(h.msg.trim()?'\n\n'+h.msg.trim():'')}
function waLink(){return 'https://wa.me/'+S.set.wa+'?text='+encodeURIComponent(helpText())}
function helpScreen(){var h=S.help;
 var needs=['Help choosing a vehicle','Exchange my current vehicle','Finance and installment advice','Inspection of a vehicle I found','Sourcing a vehicle for me'];
 var buds=['Below Rs. 50 lakhs','Rs. 50 to 80 lakhs','Rs. 80 to 120 lakhs','Above Rs. 120 lakhs'];
 return topbar(true)+'<div><h1 class="title">Ask an expert</h1><p class="sub">Send your question to a vehicle consultant on WhatsApp.</p></div>'+
 '<a class="btn ghost" href="#summary">Send my full summary instead</a>'+
 '<div class="card"><label class="field"><span>Your name</span><span class="inp"><input id="h-name" data-h="name" type="text" value="'+esc(h.name)+'" style="padding-right:14px" autocomplete="name"></span></label>'+
 '<label class="field"><span>What do you need?</span><select id="h-need" data-h="need">'+needs.map(function(n){return '<option'+(n===h.need?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label>'+
 '<label class="field"><span>Budget</span><select id="h-budget" data-h="budget">'+buds.map(function(n){return '<option'+(n===h.budget?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label>'+
 '<label class="field"><span>Anything else?</span><textarea id="h-msg" data-h="msg" placeholder="For example: I want to exchange my 2016 Axio and buy a hybrid SUV.">'+esc(h.msg)+'</textarea></label></div>'+
 '<div class="card"><h2>Your message</h2><textarea class="out" id="out-help" readonly aria-label="Message preview">'+esc(helpText())+'</textarea>'+
 '<div class="btns"><a class="btn blue" id="wa" href="'+waLink()+'" target="_blank" rel="noopener">'+ico('chat',18)+'Open WhatsApp</a><button class="btn ghost" data-act="copy" data-t="out-help" data-label="Copy message">Copy message</button></div>'+
 '<p class="hint">WhatsApp opens with this message ready to send. Nothing is sent until you press send there.</p></div>'+
 '<p class="foot">Estimates in this app are not lender offers, valuations or guarantees of vehicle condition.</p>'
}

/* ---------- router ---------- */
var TABS=[['home','Home','home'],['find','Find','find'],['finance','Finance','calc'],['check','Check','shield'],['help','Help','chat']];
var R={
 home:{html:homeScreen},
 find:{html:findScreen,after:renderMatches},
 exchange:{html:financeScreen,after:finAfter,tab:'finance',pre:function(){S.fin.exchange=true}},
 finance:{html:financeScreen,after:finAfter},
 check:{html:checkScreen,after:renderCheckSummary},
 compare:{html:compareScreen,after:renderCompare,tab:'find'},
 sell:{html:sellScreen,tab:'home'},
 help:{html:helpScreen},
 preferences:{html:settingsScreen},
 summary:{html:summaryScreen}
};
function finAfter(){autofill();calcFin()}
function show(k){var r=R[k];if(r.pre)r.pre();$('#screen').setAttribute('data-r',k);$('#screen').innerHTML=r.html();if(r.after)r.after();
 var tab=r.tab||k;$('#tabs').innerHTML=TABS.map(function(t){return '<a href="#'+t[0]+'"'+(t[0]===tab?' aria-current="page"':'')+'>'+ico(t[2],22)+t[1]+'</a>'}).join('')}
function route(){var k=(location.hash||'#home').slice(1);if(!R[k])k='home';show(k);window.scrollTo(0,0)}
applySet();
window.addEventListener('hashchange',route);

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
 if(a==='q'){S.find[b.dataset.q]=b.dataset.v;
  Array.prototype.forEach.call(b.parentNode.children,function(c){c.setAttribute('aria-pressed',c===b?'true':'false')});renderMatches()}
 else if(a==='cost'){var v=byId(b.dataset.id),f=S.fin;f.price=v.mid;f.kmpl=v.ev?Math.round(f.fuel/v.rsKm*10)/10:v.kmpl;f.touched.ins=f.touched.svc=f.touched.tyre=false;location.hash='#exchange';if(location.hash==='#exchange')show('exchange')}
 else if(a==='cmp'){S.cmp=[b.dataset.id].concat(S.cmp.filter(function(x){return x!==b.dataset.id})).slice(0,3);location.hash='#compare'}
 else if(a==='chk'){S.chkV=b.dataset.id;location.hash='#check'}
 else if(a==='fx'){S.fin.exchange=b.dataset.v==='1';show('finance')}
 else if(a==='use'){var r=tradeRange();S.fin.value=Math.round((r.lo+r.hi)/2*100)/100;S.fin.touched.value=false;setVal('value',S.fin.value);calcFin()}
 else if(a==='mode'){S.mode=b.dataset.v;show('check')}
 else if(a==='item'){var m=S.chk[S.chkV]=S.chk[S.chkV]||{},i=b.dataset.i,cur=m[i]||'open',nx=cur==='open'?'ok':cur==='ok'?'bad':'open';
  m[i]=nx;b.dataset.s=nx;b.querySelector('.st').innerHTML=stIcon(nx);b.querySelector('.sl').textContent=stLabel(nx);renderCheckSummary()}
 else if(a==='set'){S.set[b.dataset.k]=b.dataset.v;saveSet();applySet();show('preferences')}
 else if(a==='resetset'){S.set={theme:'system',accent:'#2557f6',size:'1',wa:WA_NUMBER};saveSet();applySet();show('preferences')}
 else if(a==='copy'){var ta=document.getElementById(b.dataset.t),lab=b.dataset.label;
  var done=function(t){b.textContent=t;setTimeout(function(){b.textContent=lab},1800)};
  try{navigator.clipboard.writeText(ta.value).then(function(){done('Copied')},function(){ta.select();done('Selected, now copy')})}catch(x){ta.select();done('Selected, now copy')}}
});
document.addEventListener('input',function(e){var t=e.target;
 if(t.dataset.f!==undefined){var k=t.dataset.f,f=S.fin,v=t.type==='number'?(parseFloat(t.value)||0):(isNaN(+t.value)?t.value:+t.value);
  f[k]=v;if(k==='ins'||k==='svc'||k==='tyre'||k==='value')f.touched[k]=true;
  if(k==='price'){f.touched.ins=false;f.touched.svc=false;f.touched.tyre=false}
  autofill();calcFin()}
 else if(t.dataset.s!==undefined){var s=S.sell,key=t.dataset.s;s[key]=t.type==='number'?(parseFloat(t.value)||0):t.value;$('#out-sell').value=sellText()}
 else if(t.dataset.sm!==undefined){S.sum[t.dataset.sm]=t.value;$('#out-sum').value=sumText();$('#wa-sum').href=sumLink()}
 else if(t.dataset.wa!==undefined){S.set.wa=t.value.replace(/\D/g,'');saveSet()}
 else if(t.dataset.h!==undefined){S.help[t.dataset.h]=t.value;$('#out-help').value=helpText();$('#wa').href=waLink()}
});
document.addEventListener('change',function(e){var t=e.target;
 if(t.dataset.c!==undefined&&t.value){S.cmp[+t.dataset.c]=t.value;renderCompare()}
 else if(t.dataset.ck){S.chkV=t.value;show('check')}
 else if(t.dataset.f!==undefined&&(t.tagName==='SELECT')){var f=S.fin;f[t.dataset.f]=isNaN(+t.value)?t.value:+t.value;autofill();calcFin()}
 else if(t.dataset.s!==undefined&&t.tagName==='SELECT'){S.sell[t.dataset.s]=t.value;$('#out-sell').value=sellText()}
 else if(t.dataset.h!==undefined&&t.tagName==='SELECT'){S.help[t.dataset.h]=t.value;$('#out-help').value=helpText();$('#wa').href=waLink()}
});
route();
</script>

</body></html>
